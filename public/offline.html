<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c0c">
  <title>Offline · Barakah Capital</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07100E; color: #F3F1E8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
    img { width: 180px; height: auto; margin-bottom: 40px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #7E8D91; font-size: 14px; line-height: 1.5; margin: 0 0 28px; max-width: 280px; }
    button { background: #12C98B; color: #04110c; border: 0; border-radius: 12px; padding: 12px 28px; font-size: 14px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <img src="/logo-wide-transparent.png" alt="Barakah Capital">
    <h1>You're offline</h1>
    <p>Check your internet connection. Your portfolio will load as soon as you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
